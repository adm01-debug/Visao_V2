# VISÃO - PNPM Workspace Configuration
packages:
  # Main packages
  - 'packages/*'
  # Apps
  - 'apps/*'
  # Shared libraries
  - 'libs/*'
  # Tools and configs
  - 'tools/*'
  # Documentation
  - 'docs'

# Catalog of shared dependencies
catalog:
  react: ^18.2.0
  react-dom: ^18.2.0
  typescript: ^5.3.0
  vite: ^5.0.0
  vitest: ^1.0.0
  tailwindcss: ^3.4.0
  '@tanstack/react-query': ^5.0.0
  zustand: ^4.4.0
  zod: ^3.22.0
