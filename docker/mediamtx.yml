# =============================================================================
# VISÃO - MediaMTX Configuration
# Servidor de streaming RTSP → HLS/WebRTC
# =============================================================================

# -----------------------------------------------------------------------------
# General Settings
# -----------------------------------------------------------------------------
logLevel: info
logDestinations: [stdout]
logFile: ""

# Read timeout
readTimeout: 10s
writeTimeout: 10s
readBufferCount: 512
udpMaxPayloadSize: 1472

# -----------------------------------------------------------------------------
# API (for management)
# -----------------------------------------------------------------------------
api: yes
apiAddress: :9997

# Metrics (Prometheus)
metrics: yes
metricsAddress: :9998

# PPROF (debugging)
pprof: no
pprofAddress: :9999

# -----------------------------------------------------------------------------
# RTSP Server
# -----------------------------------------------------------------------------
rtsp: yes
protocols: [tcp, udp]
encryption: "no"
rtspAddress: :8554
rtspsAddress: :8322
rtpAddress: :8000
rtcpAddress: :8001
multicastIPRange: 224.1.0.0/16
multicastRTPPort: 8002
multicastRTCPPort: 8003

# -----------------------------------------------------------------------------
# RTMP Server
# -----------------------------------------------------------------------------
rtmp: yes
rtmpAddress: :1935
rtmpEncryption: "no"
rtmpsAddress: :1936

# -----------------------------------------------------------------------------
# HLS Server (Browser playback)
# -----------------------------------------------------------------------------
hls: yes
hlsAddress: :8888
hlsEncryption: no
hlsServerKey: ""
hlsServerCert: ""
hlsAlwaysRemux: yes
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 50M
hlsAllowOrigin: '*'
hlsTrustedProxies: []
hlsDirectory: ""

# -----------------------------------------------------------------------------
# WebRTC Server (Low latency)
# -----------------------------------------------------------------------------
webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcServerKey: ""
webrtcServerCert: ""
webrtcAllowOrigin: '*'
webrtcTrustedProxies: []
webrtcLocalUDPAddress: :8890
webrtcLocalTCPAddress: ""
webrtcIPsFromInterfaces: yes
webrtcIPsFromInterfacesList: []
webrtcAdditionalHosts: []
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

# -----------------------------------------------------------------------------
# SRT Server
# -----------------------------------------------------------------------------
srt: no
srtAddress: :8890

# -----------------------------------------------------------------------------
# Recording (optional)
# -----------------------------------------------------------------------------
record: no
recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S-%f
recordFormat: fmp4
recordPartDuration: 100ms
recordSegmentDuration: 1h
recordDeleteAfter: 24h

# -----------------------------------------------------------------------------
# Paths (Camera Streams)
# -----------------------------------------------------------------------------
pathDefaults:
  # Source settings
  source: publisher
  sourceFingerprint: ""
  sourceOnDemand: no
  sourceOnDemandStartTimeout: 10s
  sourceOnDemandCloseAfter: 10s
  maxReaders: 0
  srtReadPassphrase: ""
  
  # Recording
  record: no
  
  # Authentication (empty = no auth)
  publishUser: ""
  publishPass: ""
  publishIPs: []
  readUser: ""
  readPass: ""
  readIPs: []
  
  # Fallback
  fallback: ""
  
  # Hooks
  runOnInit: ""
  runOnInitRestart: no
  runOnDemand: ""
  runOnDemandRestart: no
  runOnDemandStartTimeout: 10s
  runOnDemandCloseAfter: 10s
  runOnUnDemand: ""
  runOnReady: ""
  runOnReadyRestart: no
  runOnNotReady: ""
  runOnRead: ""
  runOnReadRestart: no
  runOnUnread: ""
  runOnRecordSegmentCreate: ""
  runOnRecordSegmentComplete: ""

paths:
  # ===========================================================================
  # CÂMERAS DE EXEMPLO - SUBSTITUIR PELOS SEUS DADOS REAIS
  # ===========================================================================
  
  # Câmera 1 - Entrada Principal
  cam-entrada:
    source: rtsp://admin:admin123@192.168.1.100:554/stream1
    sourceOnDemand: yes
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 30s
    # Autenticação para visualização (opcional)
    # readUser: visao
    # readPass: senha123

  # Câmera 2 - Estacionamento
  cam-estacionamento:
    source: rtsp://admin:admin123@192.168.1.101:554/stream1
    sourceOnDemand: yes
    sourceOnDemandCloseAfter: 30s

  # Câmera 3 - Recepção
  cam-recepcao:
    source: rtsp://admin:admin123@192.168.1.102:554/stream1
    sourceOnDemand: yes
    sourceOnDemandCloseAfter: 30s

  # Câmera 4 - Corredor
  cam-corredor:
    source: rtsp://admin:admin123@192.168.1.103:554/stream1
    sourceOnDemand: yes
    sourceOnDemandCloseAfter: 30s

  # Câmera 5 - Depósito
  cam-deposito:
    source: rtsp://admin:admin123@192.168.1.104:554/stream1
    sourceOnDemand: yes
    sourceOnDemandCloseAfter: 30s

  # Câmera 6 - Área Externa
  cam-externa:
    source: rtsp://admin:admin123@192.168.1.105:554/stream1
    sourceOnDemand: yes
    sourceOnDemandCloseAfter: 30s

  # ===========================================================================
  # STREAM DE TESTE (Demo)
  # ===========================================================================
  
  # Stream de teste público (Big Buck Bunny)
  demo:
    source: rtsp://wowzaec2demo.streamlock.net/vod/mp4:BigBuckBunny_115k.mp4
    sourceOnDemand: yes
    sourceOnDemandCloseAfter: 60s

  # ===========================================================================
  # STREAM GENÉRICO (aceita publicações externas)
  # ===========================================================================
  
  # Aceita qualquer publicação em /live/*
  "live/~^.*$":
    source: publisher

  # Path genérico para todas as câmeras dinâmicas
  "dynamic/~^.*$":
    source: publisher
