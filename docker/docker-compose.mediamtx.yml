# VISÃO - Docker Compose para MediaMTX
# Servidor de streaming RTSP → HLS/WebRTC

version: '3.8'

services:
  # MediaMTX - Servidor de mídia
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: visao-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"     # RTSP
      - "1935:1935"     # RTMP
      - "8888:8888"     # HLS
      - "8889:8889"     # WebRTC HTTP
      - "8890:8890/udp" # WebRTC UDP
      - "9997:9997"     # API
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    environment:
      - MTX_PROTOCOLS=tcp,udp
    networks:
      - visao-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9997/v3/paths/list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx para proxy reverso (opcional)
  nginx-stream:
    image: nginx:alpine
    container_name: visao-nginx-stream
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-stream.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - mediamtx
    networks:
      - visao-network

networks:
  visao-network:
    driver: bridge

volumes:
  stream-data:
