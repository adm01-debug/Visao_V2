# VISÃO - Docker Compose para MediaMTX (single-host / bridge)
# Servidor de streaming RTSP → HLS/WebRTC
# Para deploy em Docker Swarm use docker-compose.mediamtx.swarm.yml (portas host-mode).

version: '3.8'

services:
  # MediaMTX - Servidor de mídia
  mediamtx:
    image: bluenviron/mediamtx:1.18.2   # PINADO (":latest" quebra sem aviso)
    container_name: visao-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"     # RTSP
      - "1935:1935"     # RTMP
      - "8888:8888"     # HLS
      - "8889:8889"     # WebRTC HTTP (sinalização)
      - "8189:8189/udp" # WebRTC ICE (mídia) — era 8890/udp, que na verdade é SRT
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    environment:
      - MTX_RTSPTRANSPORTS=tcp,udp   # era MTX_PROTOCOLS (deprecado em v1.18.x)
    networks:
      - visao-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9997/v3/paths/list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx para proxy reverso (opcional)
  nginx-stream:
    image: nginx:alpine
    container_name: visao-nginx-stream
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-stream.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - mediamtx
    networks:
      - visao-network

networks:
  visao-network:
    driver: bridge

volumes:
  stream-data:
