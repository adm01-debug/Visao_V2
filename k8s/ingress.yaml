# VIS-O Kubernetes Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vis-o
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
    - hosts:
        - vis-o.app
        - www.vis-o.app
      secretName: vis-o-tls
  rules:
    - host: vis-o.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vis-o
                port:
                  number: 80
    - host: www.vis-o.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vis-o
                port:
                  number: 80
