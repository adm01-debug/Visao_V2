# VIS-O Kubernetes Secrets
# Note: Values should be base64 encoded in actual deployment
# This is a template file - DO NOT commit actual secrets
apiVersion: v1
kind: Secret
metadata:
  name: vis-o-secrets
  labels:
    app: vis-o
type: Opaque
stringData:
  # Supabase
  VITE_SUPABASE_URL: "your-supabase-url"
  VITE_SUPABASE_ANON_KEY: "your-supabase-anon-key"
  
  # Firebase (if used)
  VITE_FIREBASE_API_KEY: "your-firebase-api-key"
  VITE_FIREBASE_AUTH_DOMAIN: "your-firebase-auth-domain"
  VITE_FIREBASE_PROJECT_ID: "your-firebase-project-id"
  
  # Error Reporting
  VITE_ERROR_REPORTING_ENDPOINT: "your-error-reporting-endpoint"
  VITE_CRASH_REPORTING_ENDPOINT: "your-crash-reporting-endpoint"
  
  # External APIs
  VITE_MAPBOX_TOKEN: "your-mapbox-token"
  
  # Sentry (if used)
  VITE_SENTRY_DSN: "your-sentry-dsn"
---
# Note: For production, use a secrets management solution like:
# - HashiCorp Vault
# - AWS Secrets Manager
# - Azure Key Vault
# - Google Secret Manager
# - Sealed Secrets
# - External Secrets Operator
