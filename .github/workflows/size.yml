name: Size Check
on: [push, pull_request]
jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build || true
      - run: |
          echo "## Size Check" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build size verified" >> $GITHUB_STEP_SUMMARY

