name: CI Failure Alert

# Contexto: o workflow CI ficou vermelho em `main` por semanas (desde
# e9bc5c4bd) sem que ninguém notasse — não havia nenhum canal de alerta,
# só quem abrisse a aba Actions manualmente veria. Este workflow abre (ou
# comenta) uma Issue com a label `ci-failure` sempre que o CI falhar em
# `main`, e a fecha automaticamente quando o CI volta a passar — usando
# apenas o GITHUB_TOKEN nativo, sem webhook externo ou secret adicional.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  issues: write

jobs:
  on-failure:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const runUrl = run.html_url;
            const sha = run.head_sha.slice(0, 9);

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
            });

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Falha persiste em \`${sha}\`. [Ver execução](${runUrl})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔴 CI falhando em main (${sha})`,
                body:
                  `O workflow **CI** falhou em \`main\` no commit \`${sha}\`.\n\n` +
                  `[Ver execução](${runUrl})\n\n` +
                  `Esta issue fecha automaticamente quando o CI voltar a passar em main.`,
                labels: ['ci-failure'],
                assignees: ['adm01-debug'],
              });
            }

  on-success:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `CI voltou a passar em main (\`${context.payload.workflow_run.head_sha.slice(0, 9)}\`). Fechando.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
