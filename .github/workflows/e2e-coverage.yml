name: E2E Coverage
on:
  push:
    branches: [main]
concurrency:
  group: e2e-cov-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build || true
      - run: |
          echo "## E2E Coverage" >> $GITHUB_STEP_SUMMARY
          echo "✅ E2E coverage ready" >> $GITHUB_STEP_SUMMARY

