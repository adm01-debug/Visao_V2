name: E2E Tests with Coverage Reports

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build application
        run: npm run build

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:4173

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: test-results/**/*.png
          retention-days: 14

      - name: Upload Videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: videos
          path: test-results/**/*.webm
          retention-days: 14

      - name: Upload Traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: traces
          path: test-results/**/*.zip
          retention-days: 14

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results/junit.xml
          comment_mode: 'always'
          check_name: 'E2E Test Results'

      - name: Comment PR with Report Link
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && always()
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            
            const message = `## 🎭 Playwright E2E Test Report
            
            Test artifacts are available for download:
            - [📊 HTML Report](https://github.com/${owner}/${repo}/actions/runs/${run_id})
            - [📹 Videos (on failure)](https://github.com/${owner}/${repo}/actions/runs/${run_id})
            - [📷 Screenshots (on failure)](https://github.com/${owner}/${repo}/actions/runs/${run_id})
            
            View the full workflow run for detailed results.`;
            
            github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.issue.number,
              body: message
            });
