name: Coverage Report

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Run tests with coverage
        run: npm run coverage
        env:
          CI: true
      - name: Zip HTML coverage report
        if: always()
        run: |
          if [ -d coverage ]; then
            (cd coverage && zip -qr ../coverage-html.zip .)
            ls -lh coverage-html.zip || true
          else
            echo "::warning::coverage/ directory not found, skipping HTML zip"
          fi
      - name: Upload coverage artifacts (HTML + JSON + TXT)
        id: upload_coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            public/coverage-report.json
            public/coverage-report.txt
          retention-days: 14
          if-no-files-found: warn
      - name: Upload HTML zip (standalone)
        id: upload_html
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html.zip
          retention-days: 14
          if-no-files-found: warn
      - name: Build PR/job summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.upload_coverage.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          node <<'EOF'
          const fs = require('node:fs');
          const path = 'public/coverage-report.json';
          if (!fs.existsSync(path)) {
            console.log('No coverage report found, skipping summary.');
            process.exit(0);
          }
          const r = JSON.parse(fs.readFileSync(path, 'utf8'));
          const t = r.totals;
          const artifactUrl = process.env.ARTIFACT_URL || '';
          const runUrl = process.env.RUN_URL || '';
          const sha = (process.env.COMMIT_SHA || '').slice(0, 7);
          const lines = [];
          lines.push('## ✅ Coverage Report');
          lines.push('');
          lines.push(`Generated: \`${r.generatedAt}\` — ${r.files.length} files analyzed — commit \`${sha}\`.`);
          lines.push('');
          lines.push('### 📦 Artefatos');
          lines.push('');
          if (artifactUrl) {
            lines.push(`- 🔗 **[Baixar coverage-report.zip](${artifactUrl})** — HTML interativo + JSON + TXT (retenção 14 dias).`);
          } else {
            lines.push('- ⚠️ Artifact URL indisponível neste run — acesse via aba *Artifacts* da execução.');
          }
          lines.push(`- 🧭 [Ver execução completa](${runUrl})`);
          lines.push('');
          lines.push('> Após baixar, abra `coverage/index.html` no navegador para o relatório HTML interativo do Istanbul.');
          lines.push('');
          lines.push('| Metric | Coverage | Covered / Total |');
          lines.push('|--------|---------:|----------------:|');
          for (const k of ['statements','branches','functions','lines']) {
            const m = t[k];
            lines.push(`| ${k} | **${m.pct.toFixed(2)}%** | ${m.covered} / ${m.total} |`);
          }
          lines.push('');
          lines.push('### 🚨 Top 10 arquivos com menor cobertura');
          lines.push('');
          lines.push('| File | Stmts | Branches | Funcs | Lines |');
          lines.push('|------|------:|---------:|------:|------:|');
          const worst = [...r.files].sort((a, b) => a.statements.pct - b.statements.pct).slice(0, 10);
          for (const f of worst) {
            lines.push(`| \`${f.path}\` | ${f.statements.pct.toFixed(1)}% | ${f.branches.pct.toFixed(1)}% | ${f.functions.pct.toFixed(1)}% | ${f.lines.pct.toFixed(1)}% |`);
          }
          const out = lines.join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + '\n');
          fs.writeFileSync('coverage-comment.md', out);
          EOF
      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('coverage-comment.md')) return;
            const body = fs.readFileSync('coverage-comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- coverage-report-comment -->';
            const existing = await github.rest.issues.listComments({ owner, repo, issue_number });
            const prev = existing.data.find(c => c.body && c.body.includes(marker));
            const finalBody = `${marker}\n${body}`;
            if (prev) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body: finalBody });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: finalBody });
            }
