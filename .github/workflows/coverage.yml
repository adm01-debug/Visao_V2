name: Coverage Report

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Run tests with coverage
        run: npm run coverage
        env:
          CI: true
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            public/coverage-report.json
            public/coverage-report.txt
          retention-days: 14
      - name: Build PR/job summary
        if: always()
        run: |
          node <<'EOF'
          const fs = require('node:fs');
          const path = 'public/coverage-report.json';
          if (!fs.existsSync(path)) {
            console.log('No coverage report found, skipping summary.');
            process.exit(0);
          }
          const r = JSON.parse(fs.readFileSync(path, 'utf8'));
          const t = r.totals;
          const lines = [];
          lines.push('## ✅ Coverage Report');
          lines.push('');
          lines.push(`Generated: \`${r.generatedAt}\` — ${r.files.length} files analyzed.`);
          lines.push('');
          lines.push('| Metric | Coverage | Covered / Total |');
          lines.push('|--------|---------:|----------------:|');
          for (const k of ['statements','branches','functions','lines']) {
            const m = t[k];
            lines.push(`| ${k} | **${m.pct.toFixed(2)}%** | ${m.covered} / ${m.total} |`);
          }
          lines.push('');
          lines.push('### 🚨 Top 10 arquivos com menor cobertura');
          lines.push('');
          lines.push('| File | Stmts | Branches | Funcs | Lines |');
          lines.push('|------|------:|---------:|------:|------:|');
          for (const f of r.files.slice(0, 10)) {
            lines.push(`| \`${f.path}\` | ${f.statements.pct.toFixed(1)}% | ${f.branches.pct.toFixed(1)}% | ${f.functions.pct.toFixed(1)}% | ${f.lines.pct.toFixed(1)}% |`);
          }
          const out = lines.join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + '\n');
          fs.writeFileSync('coverage-comment.md', out);
          EOF
      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('coverage-comment.md')) return;
            const body = fs.readFileSync('coverage-comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- coverage-report-comment -->';
            const existing = await github.rest.issues.listComments({ owner, repo, issue_number });
            const prev = existing.data.find(c => c.body && c.body.includes(marker));
            const finalBody = `${marker}\n${body}`;
            if (prev) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body: finalBody });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: finalBody });
            }
