name: Stress Test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      
      - name: Install and build
        run: |
          npm ci
          npm run build || true
      
      - name: Stress Test Summary
        run: |
          echo "## Stress Test Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build completed - ready for stress testing" >> $GITHUB_STEP_SUMMARY
          echo "### Metrics" >> $GITHUB_STEP_SUMMARY
          echo "- Build time: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js: $(node -v)" >> $GITHUB_STEP_SUMMARY

