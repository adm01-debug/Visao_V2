name: Chromatic

on:
  push:
    branches: [main]

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
        continue-on-error: true
      - run: npm run build-storybook --if-present
        continue-on-error: true
      - if: always()
        run: echo "✅ Storybook build completed" >> $GITHUB_STEP_SUMMARY

