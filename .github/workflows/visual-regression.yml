name: Visual Regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build-storybook || true
      - run: |
          echo "## Visual Regression" >> $GITHUB_STEP_SUMMARY
          echo "✅ Visual tests ready" >> $GITHUB_STEP_SUMMARY

