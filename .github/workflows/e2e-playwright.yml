name: E2E Playwright

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright E2E (chromium, headless)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.1.34'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.1.34-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.1.34-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve Playwright version
        id: pw
        run: |
          VERSION=$(node -p "require('./package.json').devDependencies?.['@playwright/test'] || require('./package.json').dependencies?.['@playwright/test'] || ''")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers (chromium + deps)
        run: bunx playwright install --with-deps chromium

      - name: Build app
        run: bun run build

      - name: Run Playwright tests (headless, chromium)
        id: e2e
        run: bunx playwright test --project=chromium --reporter=list,html,json
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload traces & videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_id }}
          path: test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Build PR summary
        if: always() && github.event_name == 'pull_request'
        id: summary
        run: |
          node scripts/ci/build-playwright-summary.mjs \
            --input playwright-report/results.json \
            --output playwright-summary.md \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --status "${{ steps.e2e.outcome }}"
          {
            echo "### 🎭 Playwright E2E"
            echo
            cat playwright-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR with report
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: playwright-e2e
          path: playwright-summary.md
