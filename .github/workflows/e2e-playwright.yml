name: E2E Playwright

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright E2E (chromium, shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        total: [2]

    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      # Opcional: só serve para o global-setup criar/atualizar o usuário de teste.
      # Sem ela, o setup faz login com E2E_TEST_EMAIL/E2E_TEST_PASSWORD.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # As rotas /__test/* (harnesses com invoke mockado) só existem no dev server;
      # este build é servido por `vite preview`, então precisa incluí-las. O build
      # de deploy não define a variável.
      VITE_E2E_HARNESS: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.0'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.2.0-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.2.0-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve Playwright version
        id: pw
        run: |
          VERSION=$(node -p "require('./package.json').devDependencies?.['@playwright/test'] || require('./package.json').dependencies?.['@playwright/test'] || ''")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers (chromium + deps)
        timeout-minutes: 20
        run: |
          set -e
          n=0
          until bunx playwright install --with-deps chromium; do
            n=$((n+1))
            if [ "$n" -ge 5 ]; then
              echo "::error::Falha ao instalar browsers Playwright apos 5 tentativas (rede apt instavel)."
              exit 1
            fi
            echo "Falha transitoria de rede ao instalar browsers - tentativa $n/5, aguardando 15s..."
            sleep 15
          done
      - name: Export Supabase env (secrets → build e testes)
        env:
          S_URL: ${{ secrets.VITE_SUPABASE_URL }}
          S_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          S_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          [ -n "$S_URL" ] && echo "VITE_SUPABASE_URL=$S_URL" >> "$GITHUB_ENV"
          [ -n "$S_KEY" ] && echo "VITE_SUPABASE_PUBLISHABLE_KEY=$S_KEY" >> "$GITHUB_ENV"
          [ -n "$S_REF" ] && echo "VITE_SUPABASE_PROJECT_ID=$S_REF" >> "$GITHUB_ENV"
          true

      - name: Build app
        run: bun run build

      # Diagnóstico — não decide nada sozinho. Com E2E_TEST_EMAIL/PASSWORD
      # presentes, rota autenticada que cair em /auth FALHA (authSession.ts) e o
      # global-setup aborta se o login for recusado. Sem eles, essas rotas são
      # puladas com motivo explícito.
      - name: Guard required secrets
        run: |
          if [ -z "${E2E_TEST_EMAIL:-}" ] || [ -z "${E2E_TEST_PASSWORD:-}" ]; then
            echo "::warning::E2E_TEST_EMAIL/E2E_TEST_PASSWORD ausentes — testes autenticados serão pulados (skip). Configure em Settings → Secrets → Actions para cobertura E2E completa."
          fi
          url="${VITE_SUPABASE_URL:-}"
          if [ -z "$url" ]; then
            url=$(sed -n 's/^VITE_SUPABASE_URL=//p' .env.production | tr -d '"')
            echo "::warning::Secret VITE_SUPABASE_URL ausente — build e testes usam o .env.production ($url)."
          fi
          host=$(echo "$url" | sed -E 's#^https?://([^/]+).*#\1#')
          if [ -n "$host" ] && ! getent hosts "$host" > /dev/null; then
            echo "::error::VITE_SUPABASE_URL ($host) não resolve no DNS — esse projeto Supabase não existe mais; app e login E2E não funcionam contra ele."
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::notice::SUPABASE_SERVICE_ROLE_KEY ausente — o usuário de teste não é criado/atualizado; o login usa E2E_TEST_EMAIL/E2E_TEST_PASSWORD como estão."
          fi

      - name: Run Playwright tests (headless, chromium, shard ${{ matrix.shard }}/${{ matrix.total }})
        id: e2e
        run: bunx playwright test --project=chromium --shard=${{ matrix.shard }}/${{ matrix.total }} --reporter=list,blob,json
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
          PLAYWRIGHT_JSON_OUTPUT_NAME: blob-report/results-${{ matrix.shard }}.json

      - name: Upload blob report (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-${{ github.run_id }}-${{ matrix.shard }}
          path: blob-report/**
          if-no-files-found: warn
          retention-days: 3

      - name: Upload traces & videos (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_id }}-${{ matrix.shard }}
          path: test-results/**
          if-no-files-found: ignore
          retention-days: 7

  merge-reports:
    name: Merge Playwright reports & comment PR
    needs: playwright
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.0'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: playwright-blob-${{ github.run_id }}-*
          merge-multiple: true

      - name: Merge into single HTML report
        run: bunx playwright merge-reports --reporter=html,json ./all-blob-reports > merged-results.json || true

      - name: Upload merged HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/**
          if-no-files-found: warn
          retention-days: 14

      - name: Build PR summary
        if: always() && github.event_name == 'pull_request'
        run: |
          node scripts/ci/build-playwright-summary.mjs \
            --input merged-results.json \
            --output playwright-summary.md \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --status "${{ needs.playwright.result }}"
          {
            echo "### 🎭 Playwright E2E (merged shards)"
            echo
            cat playwright-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR with report
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: playwright-e2e
          path: playwright-summary.md
