name: Kubernetes Deploy

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: "Target cluster"
        required: true
        default: "staging"

concurrency:
  group: k8s-${{ github.ref }}
  cancel-in-progress: false

jobs:
  k8s-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      
      - name: Build
        run: |
          npm ci
          npm run build || true
      
      - name: K8s Summary
        run: |
          echo "## Kubernetes Deployment" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build ready for K8s deployment" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Info" >> $GITHUB_STEP_SUMMARY
          echo "- Cluster: ${{ inputs.cluster }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

