name: PR Verify Stack & Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: verify (node ${{ matrix.node }} / bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
        bun: ['1.2.0', 'latest']
        include:
          - node: '20'
            bun: '1.2.0'
            primary: true
          - node: '22'
            bun: 'latest'
            primary: false
        exclude:
          - node: '20'
            bun: 'latest'
          - node: '22'
            bun: '1.2.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Bun ${{ matrix.bun }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ matrix.bun }}-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ matrix.bun }}-
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache TypeScript incremental info
        uses: actions/cache@v4
        with:
          path: |
            **/*.tsbuildinfo
            node_modules/.cache/tsbuildinfo
          key: ${{ runner.os }}-tsbuildinfo-${{ matrix.node }}-${{ hashFiles('tsconfig*.json', 'src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-tsbuildinfo-${{ matrix.node }}-

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test:unit

      - name: TypeScript type-check (strict — inclui tests/ + stories)
        run: bun run type-check:strict

      - name: Verify stack (deps + module resolution + tsgo + vite bootstrap)
        run: bun run verify:stack

      - name: Upload verify:stack reports
        if: always() && matrix.primary
        uses: actions/upload-artifact@v4
        with:
          name: verify-stack-reports-${{ github.run_id }}
          path: |
            reports/**
            coverage/**
            playwright-report/**
            test-results/**
            *.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run build

      - name: Upload build artifacts (dist)
        if: always() && matrix.primary
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.run_id }}
          path: |
            dist/**
            !dist/**/*.map
          if-no-files-found: warn
          retention-days: 14

      - name: Upload post-build reports
        if: always() && matrix.primary
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_id }}
          path: |
            reports/bundle/**
            reports/quality-gates/**
            reports/mobile-nav/**
            reports/deadcode/**
            stats.html
          if-no-files-found: ignore
          retention-days: 14
