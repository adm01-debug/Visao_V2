name: PR Verify Stack & Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: lint + test:unit + verify:stack + build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test:unit

      - name: Verify stack (lint + type-check + tests)
        run: bun run verify:stack

      - name: Upload verify:stack reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-stack-reports-${{ github.run_id }}
          path: |
            reports/**
            coverage/**
            playwright-report/**
            test-results/**
            *.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run build

      - name: Upload build artifacts (dist)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.run_id }}
          path: |
            dist/**
            !dist/**/*.map
          if-no-files-found: warn
          retention-days: 14

      - name: Upload post-build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_id }}
          path: |
            reports/bundle/**
            reports/quality-gates/**
            reports/mobile-nav/**
            reports/deadcode/**
            stats.html
          if-no-files-found: ignore
          retention-days: 14


