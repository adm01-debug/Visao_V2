name: Feature Flags

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: feature-flags-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
        continue-on-error: true
      - run: echo 'Feature flags check'
        continue-on-error: true
      - if: always()
        run: echo "✅ Feature Flags completed" >> $GITHUB_STEP_SUMMARY

