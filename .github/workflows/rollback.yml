name: Rollback
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rollback to"
        required: true
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - run: |
          echo "## Rollback" >> $GITHUB_STEP_SUMMARY
          echo "Rolling back to: ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY

