name: Security

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      
      - run: npm ci --legacy-peer-deps
      
      - name: Security Audit
        run: npm audit --audit-level=high
      
      - name: Summary
        if: always()
        run: echo "## 🔒 Security check completed" >> $GITHUB_STEP_SUMMARY
