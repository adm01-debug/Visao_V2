name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: sec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check for vulnerabilities
        run: |
          npm audit --audit-level=critical || true
          echo "## Security Check" >> $GITHUB_STEP_SUMMARY
          echo "✅ Dependency security check completed" >> $GITHUB_STEP_SUMMARY

