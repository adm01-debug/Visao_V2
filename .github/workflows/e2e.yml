name: E2E Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run Playwright E2E (with auth seed)
        run: npx playwright test --project=chromium
        env:
          CI: true
          # Auth seed (global-setup.ts) — opcional. Se ausentes, testes
          # autenticados fazem skip controlado via authSession.ts.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      - name: Build mobile-nav diff report
        if: always()
        run: npm run report:mobile-nav-diff || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-nav-diff-report
          path: test-results/mobile-nav-diff-report.html
          retention-days: 14
          if-no-files-found: ignore
      - name: Summary
        if: always()
        run: echo "## ✅ E2E Tests completed" >> $GITHUB_STEP_SUMMARY
