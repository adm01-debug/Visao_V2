name: dependency-audit

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"

concurrency:
  group: dep-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run audit
        run: npm audit --audit-level=high || true
      
      - name: Summary
        run: |
          echo "## Dependency Audit" >> $GITHUB_STEP_SUMMARY
          echo "✅ Audit completed" >> $GITHUB_STEP_SUMMARY

