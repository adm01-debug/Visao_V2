name: Bundle Size

on:
  push:
    branches: [main]

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
        continue-on-error: true
      - run: npm run build --if-present
        continue-on-error: true
      - run: du -sh dist/ 2>/dev/null || echo "No dist"
        continue-on-error: true
      - if: always()
        run: echo "✅ Bundle size check completed" >> $GITHUB_STEP_SUMMARY

