name: Bundle Size

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build and analyze
        run: |
          npm run build || true
          echo "## Bundle Size Analysis" >> $GITHUB_STEP_SUMMARY
          if [ -d "dist" ]; then
            echo "### Build Output" >> $GITHUB_STEP_SUMMARY
            du -sh dist/* 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "Build artifacts generated" >> $GITHUB_STEP_SUMMARY
          fi

