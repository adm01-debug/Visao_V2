name: Performance

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
        continue-on-error: true
      - run: npm run build --if-present
        continue-on-error: true
      - if: always()
        run: echo "✅ Performance completed" >> $GITHUB_STEP_SUMMARY

