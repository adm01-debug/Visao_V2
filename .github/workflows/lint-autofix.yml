name: Lint Auto-fix

# Gera patch de layout validado, sem publicar alteracoes em branches.
on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch de trabalho para gerar patch (main/develop proibidas)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lint-autofix-${{ github.event.pull_request.head.ref || inputs.branch }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  autofix:
    name: Patch de layout validado
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        !contains(github.event.pull_request.labels.*.name, 'skip-autofix')
      )
    env:
      AUTOFIX_BRANCH: ${{ github.event.pull_request.head.ref || inputs.branch }}
      AUTOFIX_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Bloquear branches de producao
        run: |
          TARGET="${AUTOFIX_BRANCH#refs/heads/}"
          if [ "$TARGET" = main ] || [ "$TARGET" = develop ] || [ -z "$TARGET" ]; then
            echo '::error::Use uma branch de trabalho; main/develop sao proibidas.'
            exit 1
          fi
          git check-ref-format --branch "$TARGET"

      - name: Checkout da branch de trabalho
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.branch }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Validar contrato do autofix
        run: node --test scripts/autofix-lint/run.test.mjs

      - name: Corrigir layout e validar ESLint do diff
        id: patch
        env:
          AUTOFIX_PATCH_PATH: ${{ runner.temp }}/lint-autofix.patch
        run: node scripts/autofix-lint/run.mjs

      - name: Validar TypeScript apos correcao
        if: steps.patch.outputs.has_files == 'true'
        run: npm run type-check:strict

      - name: Disponibilizar patch validado
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lint-autofix-${{ github.run_id }}
          path: ${{ runner.temp }}/lint-autofix.patch
          if-no-files-found: error
          retention-days: 14
