# docs:
#   gatilho: agendado (segunda 10:23 UTC / 07:23 BRT) e workflow_dispatch
#   prova: inventario/estado/ (rotas, edge functions e, com token, banco) regerado do codigo em main
#          e do banco oficial; PR automatico so quando o conteudo muda de verdade
#   falha: o job fica vermelho e o inventario nao e atualizado (o anterior continua valendo)
#   avisa: PR na branch automation/inventario-estado com o inventario novo
name: Inventário do estado real (semanal)

# Refaz inventario/estado/ a partir do CODIGO (rotas do front e edge functions) e, quando o secret
# SUPABASE_ACCESS_TOKEN existir, tambem do BANCO oficial (somente leitura, Management API).
# Scripts: scripts/inventario/gerar-rotas.mjs, gerar-repo.mjs e gerar-banco.mjs.
# Nunca faz push direto em main: entrega via PR na branch automation/inventario-estado.
#
# Secrets (opcional):
#   - SUPABASE_ACCESS_TOKEN: so leitura — POST /database/query/read-only e GET /functions do projeto
#     pmzxbffnbenkmzpnbehb. Sem ele, o inventario do banco e pulado com aviso e o resto continua.

on:
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:

concurrency:
  group: inventario-estado-semanal
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  gerar:
    name: Refazer inventario/estado
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # branch do PR (automation/inventario-estado)
      pull-requests: write # abrir o PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Instalar ripgrep (usado pelo gerar-repo.mjs)
        run: command -v rg || sudo apt-get install -y --no-install-recommends ripgrep

      - name: Testar os geradores
        run: node --test scripts/inventario/inventario.unit.mjs

      - name: Inventário do repositório (rotas do front e edge functions)
        run: |
          node scripts/inventario/gerar-rotas.mjs
          # < /dev/null: sem lista de tabelas no stdin o script so grava edges.json
          node scripts/inventario/gerar-repo.mjs < /dev/null

      - name: Inventário do banco oficial (somente leitura; pulado sem o secret)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN ausente — inventario/estado/banco.json nao foi atualizado neste run (veja scripts/inventario/README.md)"
            exit 0
          fi
          node scripts/inventario/gerar-banco.mjs

      - name: Decidir se vale PR
        id: mudou
        # Compara o JSON sem os carimbos de data e sem a telemetria rolante de 7 dias: diff de linha
        # nao serve (edges.json e gravado numa linha so, com a data dentro).
        run: |
          valor="$(node scripts/inventario/mudou-conteudo.mjs)"
          echo "valor=$valor" >> "$GITHUB_OUTPUT"
          [ "$valor" = "true" ] || echo "Inventário sem mudança de conteúdo — nenhum PR a abrir."

      - name: Abrir ou atualizar o PR do inventário
        if: steps.mudou.outputs.valor == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/inventario-estado
          HUSKY: '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add -- inventario/estado
          if git diff --cached --quiet; then
            echo "Nada em inventario/estado para commitar."; exit 0
          fi
          git commit -m 'chore(inventario): estado real do projeto [auto]'
          git push --force-with-lease=refs/heads/"$BRANCH" origin "HEAD:refs/heads/$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title 'chore(inventario): inventário do estado real (semanal)' \
              --body "$(printf '%s\n' \
                'Inventário refeito automaticamente por `.github/workflows/inventario-estado-semanal.yml`:' \
                'código em `main` (rotas do front e edge functions) + banco oficial quando há token.' \
                'Só arquivos em `inventario/estado/`.' \
                '' \
                "- main de origem: \`${GITHUB_SHA}\`" \
                "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          else
            echo "PR de $BRANCH já está aberto — branch atualizada."
          fi

      - name: Upload do inventário
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventario-estado-${{ github.run_id }}
          path: inventario/estado/
          retention-days: 14
