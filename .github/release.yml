changelog:
  categories:
    - title: '🚀 Features'
      labels: ['feature', 'enhancement']
    - title: '🐛 Bug Fixes'
      labels: ['bug', 'fix']
    - title: '📚 Documentation'
      labels: ['documentation']
    - title: '🧪 Tests'
      labels: ['tests']
    - title: '🔧 Maintenance'
      labels: ['chore', 'dependencies']
    - title: '⚡ Performance'
      labels: ['performance']
    - title: '🔒 Security'
      labels: ['security']
